# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - runkeeper-strava-sync

on:
  push:
    branches:
      - feature/v2-rewrite
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '24' # set this to the node version to use (supports 8.x, 10.x, 12.x)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Npm'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm install
          npm run build --if-present
          npm run test --if-present
          popd

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FE385D4F3C940A59009CCBD6F2EAC2E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CA649B1BC6554695B846F1EC4E868998 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CBB713805EAA4B66BBDC817D262B0B93 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'runkeeper-strava-sync'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # set up repository secrets in github with the name and resource group of the function app you set up in your Azure tenant
      - name: Get Function App URL
        id: function-url
        shell: bash
        run: | 
            hostname=$(az functionapp show --name "${{ secrets.AZURE_FUNCTIONAPP_NAME }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "defaultHostName" --output "tsv")
            echo "Retrieved hostname: $hostname"
            echo "url=https://$hostname" >> "$GITHUB_OUTPUT"

      # runs the function to deploy the Runkeeper to Strava website
      - name: Deploy static site
        run: curl -X POST ${{ steps.function-url.outputs.url }}/api/deploystaticcontent
          